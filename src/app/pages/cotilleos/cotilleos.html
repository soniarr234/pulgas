<div class="cotilleos-page">

  <h1 class="cotilleos-title">
    👀 Cotilleos
  </h1>

  @for (cotilleo of cotilleos; track cotilleo.id) {

    <div class="cotilleo-card">

      <div class="cotilleo-texto">
        {{ cotilleo.texto }}
      </div>

      <div class="cotilleo-fecha">
        {{ cotilleo.fecha }}
      </div>

    </div>

  }

</div>
