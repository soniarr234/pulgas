<div class="programa-page">
  <div class="programa-header">
    <div class="programa-badge">SEPTIEMBRE</div>

    <h1 class="programa-title">Programación 2026</h1>
  </div>

  <div class="programa-calendar">
    <div class="programa-weekday">L</div>
    <div class="programa-weekday">M</div>
    <div class="programa-weekday">X</div>
    <div class="programa-weekday">J</div>
    <div class="programa-weekday">V</div>
    <div class="programa-weekday">S</div>
    <div class="programa-weekday">D</div>

    <!-- hueco lunes -->

    <div class="programa-empty"></div>

    <!-- martes -->

    <div class="programa-day disabled">1</div>
    <div class="programa-day disabled">2</div>
    <div class="programa-day disabled">3</div>
    <div class="programa-day disabled">4</div>
    <div class="programa-day disabled">5</div>
    <div class="programa-day disabled">6</div>

    <div class="programa-day disabled">7</div>
    <div class="programa-day disabled">8</div>
    <div class="programa-day disabled">9</div>
    <div class="programa-day disabled">10</div>

    <div class="programa-day active" (click)="abrirDia(11)">11</div>
    <div class="programa-day active" (click)="abrirDia(12)">12</div>
    <div class="programa-day active" (click)="abrirDia(13)">13</div>

    <div class="programa-day active" (click)="abrirDia(14)">14</div>
    <div class="programa-day active" (click)="abrirDia(15)">15</div>

    <div class="programa-day disabled">16</div>
    <div class="programa-day disabled">17</div>
    <div class="programa-day disabled">18</div>
    <div class="programa-day disabled">19</div>
    <div class="programa-day disabled">20</div>

    <div class="programa-day disabled">21</div>
    <div class="programa-day disabled">22</div>
    <div class="programa-day disabled">23</div>
    <div class="programa-day disabled">24</div>
    <div class="programa-day disabled">25</div>
    <div class="programa-day disabled">26</div>
    <div class="programa-day disabled">27</div>

    <div class="programa-day disabled">28</div>
    <div class="programa-day disabled">29</div>
    <div class="programa-day disabled">30</div>
  </div>
</div>

@if (mostrarModal) {

<div class="programa-modal-backdrop" (click)="cerrarModal()">
  <div class="programa-modal" (click)="$event.stopPropagation()">
    <div class="programa-modal-header">
      <h2>{{ diaSeleccionado.titulo }}</h2>
      <button class="programa-close" (click)="cerrarModal()">✕</button>
    </div>

    <div class="programa-separador"></div>

    <div class="programa-eventos-title">Eventos del día</div>

    @for (evento of diaSeleccionado.eventos; track evento) {

    <div class="programa-evento">
      <div class="programa-evento-content">
        <div class="programa-evento-hora">{{ evento.hora }}</div>

        <div class="programa-evento-nombre">{{ evento.nombre }}</div>
      </div>
    </div>

    }
  </div>
</div>

}

<app-navbar></app-navbar>
